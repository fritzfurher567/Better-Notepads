name: Build Notepad EXEs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Lite
        run: pyinstaller --onefile --windowed --name Notepad-Lite notepad.py

      - name: Build Standard
        run: pyinstaller --onefile --windowed --name Notepad-Standard notepad_extended.py

      - name: Build Pro
        run: pyinstaller --onefile --windowed --name Notepad-Pro notepad_pro.py

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: notepad-exes
          path: dist/*.exe
