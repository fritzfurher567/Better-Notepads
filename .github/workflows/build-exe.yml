name: Build Notepad Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # --- Step 1: compile each script into a standalone .exe ---
      - name: Build Lite exe
        run: pyinstaller --onefile --windowed --name Notepad-Lite Notepad-Lite.py

      - name: Build Standard exe
        run: pyinstaller --onefile --windowed --name Notepad-Standard Notepad-Standard.py

      - name: Build Pro exe
        run: pyinstaller --onefile --windowed --name Notepad-Pro Notepad-Pro.py

      # --- Step 2: wrap each exe in a proper setup wizard installer ---
      - name: Compile Lite installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Lite.iss'

      - name: Compile Standard installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Standard.iss'

      - name: Compile Pro installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Pro.iss'

      # --- Step 3: upload the finished setup wizards ---
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: notepad-installers
          path: dist-installers/*.exe
