name: Build Notepad Installers

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Lite exe
        run: pyinstaller --onefile --windowed --name Notepad-Lite Notepad-Lite.py

      - name: Build Standard exe
        run: pyinstaller --onefile --windowed --name Notepad-Standard Notepad-Standard.py

      - name: Build Pro exe
        run: pyinstaller --onefile --windowed --name Notepad-Pro Notepad-Pro.py

      - name: Compile Lite installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Lite.iss'

      - name: Compile Standard installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Standard.iss'

      - name: Compile Pro installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Pro.iss'

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-installers
          path: dist-installers/*.exe

      - name: Publish GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*.exe
